name: NABD local financial correctness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Create isolated static release
        run: |
          node scripts/build-static.mjs
          test ! -e dist/supabase
          test ! -e dist/tests
          test ! -e dist/AGENTS.md
          test ! -e dist/.github
      - name: Static syntax
        run: npm run check
      - name: Financial regression suite
        run: npm test
      - name: Static-server smoke
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 > /tmp/nabd-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/ -o /tmp/nabd-response.html; then break; fi
            sleep 1
          done
          grep -q 'NABD' /tmp/nabd-response.html
          for asset in /agents.js /product-app.js /product-ui.css /cloud-service.js /cloud-config.js /transaction-utils.js /sw.js /privacy.html; do
            curl --fail --silent --show-error "http://127.0.0.1:8765$asset" >/dev/null
          done

      - name: Install test-only Chrome control library
        if: github.event_name == 'pull_request'
        run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - name: Verify actual desktop/mobile UI and offline PWA
        if: github.event_name == 'pull_request'
        run: |
          python3 -m http.server 8765 --directory dist --bind 127.0.0.1 > /tmp/nabd-browser-server.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/product-browser.mjs
          node tests/cloud-browser.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'pull_request' && always()
        with:
          name: nabd-ui-preview
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7
