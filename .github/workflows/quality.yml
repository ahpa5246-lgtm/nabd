name: NABD local financial correctness
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Static syntax
        run: npm run check
      - name: Financial regression suite
        run: npm test
      - name: Static-server smoke
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nabd-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:8765/ -o /tmp/nabd-response.html; then break; fi
            sleep 1
          done
          grep -q 'NABD' /tmp/nabd-response.html
          for asset in /agents.js /app.js /transaction-utils.js /sw.js /privacy.html; do
            curl --fail --silent --show-error "http://127.0.0.1:8765$asset" >/dev/null
          done
