name: Merchant tenant security
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  postgres-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nabd_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nabd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: local_test_only
      PGDATABASE: nabd_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run real PostgreSQL multitenant policy tests
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/cloud-rls.sql
      - name: Verify cloud client syntax
        run: node --check cloud-service.js && node --check product-app.js
